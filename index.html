function sugCard(p){var x=p.x;return '<div class="item sugcard"><div class="th t'+(TN[x.c]||4)+'">'+ic("dish",28)+'</div><div><b>'+esc(x.n)+'</b><small>TudoGostoso</small><div class="acts"><a class="link" href="'+x.u+'" target="_blank" rel="noopener">Ver receita</a><button class="link" data-addsug="'+SUGG.indexOf(x)+'">Adicionar ao caderno</button></div></div></div>'}
function sugHtml(){
  var c=ctx(),dia=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][c.w],per={morning:"de manhã",lunch:"na hora do almoço",afternoon:"à tarde",night:"à noite"}[c.per];
  var meta=dia+", "+per+(c.temp==null?"":" · "+Math.round(c.temp)+" °C");
  var head=(c.mood==="cold"?"Friozinho pede algo quentinho":c.mood==="hot"?"Calor pede algo leve e fresquinho":"Tempo ameno para cozinhar com calma")+(c.free?", sem pressa":", e prático");
  var have={};S.rows.forEach(function(r){if(r.source_url)have[r.source_url]=1});
  var pool=SUGG.filter(function(x){return !have[x.u]}).map(function(x){var s=score({id:x.u,tags:x.t,category:x.c},c);if(x.m.indexOf(c.mood)>-1)s+=3;return {x:x,s:s}}).sort(function(a,b){return b.s-a.s}).slice(0,3);
  return '<div class="sugh">'+ic(c.mood==="hot"?"sun":"cup",32)+'<div><small>'+meta+'</small><b>'+head+'</b></div></div><div class="list">'+pool.map(sugCard).join('')+'</div>'}
async function wx(){
  var m=(S.user&&S.user.user_metadata)||{},la=m.lat||-23.6229,lo=m.lon||-46.5548;
  if(S.wx&&Date.now()-S.wx.at<1800000)return;
  try{var r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+la+"&longitude="+lo+"&current=temperature_2m&timezone=auto"),j=await r.json();S.wx={t:j.current.temperature_2m,at:Date.now()}}catch(e){}
  var el=$("sug");if(el&&S.v==="home")el.innerHTML=sugHtml()}

  '<p class="lbl">Explorar</p><div class="chips">'+TAGS.map(function(t){return '<button class="chip" data-tag="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>'+
  (n?'':'<div class="box" data-go="add" style="margin-top:20px">Seu caderno está vazio. Toque aqui para criar a primeira receita.</div>')}
function me(){
  var m=S.user.user_metadata||{};
  return '<h2>Perfil</h2><p class="sub">Como você quer ser chamada e onde você está.</p>'+
  '<label class="fl" for="m_nick">Nome ou apelido</label><input class="f" id="m_nick" value="'+esc(m.apelido||"")+'" placeholder="Como devemos te chamar?">'+
  '<label class="fl" for="m_city">Cidade (para sugerir receitas pelo clima)</label><input class="f" id="m_city" value="'+esc(m.city||"São Caetano do Sul")+'">'+
  '<p style="color:var(--mut);font-size:14px">O app não usa o GPS e não pede permissão de localização. Ele usa só a cidade escrita aqui.</p>'+
  '<div class="err" id="merr"></div><button class="btn" data-act="saveme" id="mbtn">Salvar</button><button class="btn alt" data-act="logout">Sair da conta</button>'}
async function saveMe(){
  var b=$("mbtn"),nick=$("m_nick").value.trim(),city=$("m_city").value.trim(),old=S.user.user_metadata||{},meta={apelido:nick,city:city,lat:old.lat,lon:old.lon};
  b.disabled=true;b.textContent="Salvando…";
  try{
    if(city&&(city!==old.city||!old.lat)){
      var g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=pt"),j=await g.json();
      if(!j.results||!j.results.length){$("merr").textContent="Não encontrei essa cidade.";b.disabled=false;b.textContent="Salvar";return}
      meta.lat=j.results[0].latitude;meta.lon=j.results[0].longitude;meta.city=j.results[0].name}
    var r=await sb.auth.updateUser({data:meta});if(r.error)throw r.error;
    S.user=r.data.user;S.wx=null;S.v="home";draw();toast("Perfil salvo")
  }catch(e){b.disabled=false;b.textContent="Salvar";$("merr").textContent=nice(e)}}
function list(){
  var l=S.rows.filter(function(r){return S.cat?r.category===S.cat:S.tag?(r.tags||[]).indexOf(S.tag)>-1:true});
  var q=S.q.trim().toLowerCase();
  if(q)l=S.rows.filter(function(r){return (r.title+" "+(r.tags||[]).join(" ")+" "+(r.ingredients||[]).join(" ")).toLowerCase().indexOf(q)>-1});
  return '<button class="back" data-go="home">'+ic("back",18)+'Início</button><h2>'+esc(q?"Resultados":(S.cat||S.tag))+'</h2><p class="sub">'+l.length+(l.length===1?" receita":" receitas")+'</p>'+
  (l.length?'<div class="list">'+l.map(item).join('')+'</div>':'<div class="box" data-go="add">Nenhuma receita aqui ainda. Toque para criar.</div>')}
function favs(){
  var l=S.rows.filter(function(r){return r.is_favorite});
  return '<h2>Favoritas</h2><p class="sub">'+l.length+(l.length===1?" receita":" receitas")+'</p>'+
  (l.length?'<div class="list">'+l.map(item).join('')+'</div>':'<div class="box">Toque no coração dentro de uma receita para guardá-la aqui.</div>')}
function recipe(){
  var r=byId(S.id);if(!r)return home();
  var ru=r.result_photo_path&&S.urls[r.result_photo_path];
  return '<div class="top"><button class="back" data-go="list">'+ic("back",18)+'Voltar</button><button class="link" data-act="fav" aria-label="Favoritar" style="color:var(--sage)">'+ic("heart",26,r.is_favorite)+'</button></div><div class="rec"><div class="rl">'+
  '<h2>'+esc(r.title)+'</h2><div class="hero t'+(TN[r.category]||4)+'">'+thumb(r,true)+'</div>'+
  '<div class="facts"><div>'+ic("clock",22)+'<b>'+esc(r.prep_time||"—")+'</b><small>Tempo</small></div><div>'+ic("hat",22)+'<b>'+esc(r.difficulty||"—")+'</b><small>Dificuldade</small></div><div>'+ic("dish",22)+'<b>'+esc(r.servings||"—")+'</b><small>Porções</small></div></div>'+
  ((r.tags||[]).length?'<div class="chips wrap" style="margin-top:14px">'+r.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div>':'')+
  '</div><div class="rr">'+
  '<h3>'+ic("jug",22)+'Ingredientes</h3>'+((r.ingredients||[]).length?'<ul>'+r.ingredients.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>':'<p class="sub" style="margin:0">Sem ingredientes ainda.</p>')+
  '<h3>'+ic("list",22)+'Modo de preparo</h3>'+((r.steps||[]).length?'<ol>'+r.steps.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ol>':'<p class="sub" style="margin:0">Sem passos ainda.</p>')+
  '<h3>Minhas observações</h3><p style="color:var(--mut);white-space:pre-wrap;margin:0">'+esc(r.notes||"Nenhuma anotação ainda.")+'</p>'+
  (r.source_url?'<p><a class="link" href="'+esc(r.source_url)+'" target="_blank" rel="noopener">Ver receita original</a></p>':'')+
  '<h3>Minha foto do resultado</h3>'+
  (ru?'<img style="display:block;width:100%;height:210px;object-fit:cover;border-radius:22px;margin:0 0 10px" src="'+ru+'" alt="Foto do resultado">':'')+
  '<label class="box">'+ic("cam",22)+(ru?'Trocar a foto':'Tirar ou escolher foto')+'<input type="file" id="resq" accept="image/*" hidden></label>'+
  '<button class="btn alt" data-act="edit">Editar receita</button></div></div>'}
function form(){
  var r=S.edit||{};
  var cu=r.photo_path&&S.urls[r.photo_path];
  function opt(v,cur){return '<option'+(v===cur?' selected':'')+'>'+v+'</option>'}
  return '<button class="back" data-act="cancel">'+ic("back",18)+'Cancelar</button><h2>'+(r.id?'Editar receita':'Nova receita')+'</h2><p class="sub">Preencha o que souber. O resto você completa depois.</p>'+
  '<label class="fl" for="f_title">Nome da receita</label><input class="f" id="f_title" value="'+esc(r.title)+'">'+
  '<label class="fl" for="f_cat">Categoria</label><select class="f" id="f_cat">'+CATS.map(function(c){return opt(c[0],r.category||"Minhas receitas")}).join('')+'</select>'+
  '<div class="row"><div><label class="fl" for="f_time">Tempo</label><input class="f" id="f_time" placeholder="40 min" value="'+esc(r.prep_time)+'"></div>'+
  '<div><label class="fl" for="f_dif">Nível</label><select class="f" id="f_dif"><option value="">—</option>'+["Fácil","Médio","Difícil"].map(function(v){return opt(v,r.difficulty)}).join('')+'</select></div>'+
  '<div><label class="fl" for="f_por">Porções</label><input class="f" id="f_por" placeholder="8" value="'+esc(r.servings)+'"></div></div>'+
  '<label class="fl" for="f_tags">Etiquetas (separe por vírgula)</label><input class="f" id="f_tags" placeholder="Bolos, Festa" value="'+esc((r.tags||[]).join(", "))+'">'+
  '<div class="chips wrap">'+TAGS.map(function(t){return '<button type="button" class="chip" data-addtag="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>'+
  '<label class="fl" for="f_ing">Ingredientes (um por linha)</label><textarea class="f" id="f_ing" rows="6">'+esc((r.ingredients||[]).join("\n"))+'</textarea>'+
  '<label class="fl" for="f_steps">Modo de preparo (um passo por linha)</label><textarea class="f" id="f_steps" rows="6">'+esc((r.steps||[]).join("\n"))+'</textarea>'+
  '<label class="fl" for="f_notes">Minhas observações</label><textarea class="f" id="f_notes" rows="3">'+esc(r.notes)+'</textarea>'+
  '<label class="fl">Foto da receita</label><img class="prev" id="prev_cover" alt=""'+(cu?' src="'+cu+'" style="display:block"':'')+'>'+
  '<label class="box">'+ic("cam",22)+'Tirar ou escolher foto<input type="file" id="f_cover" accept="image/*" hidden></label>'+
  '<div class="err" id="ferr"></div><button class="btn" data-act="save" id="sbtn">Salvar receita</button>'+
  (r.id?'<button class="btn del" data-act="del">Apagar esta receita</button>':'')}
function nav(){
  var n=[["home","home","Início"],["favs","heart","Favoritas"],["add","plus","Nova"],["me","user","Perfil"]];
  $("nav").innerHTML=n.map(function(x){var on=(S.v===x[0]||(x[0]==="home"&&(S.v==="list"||S.v==="recipe"))||(x[0]==="add"&&S.v==="form"));return '<button class="'+(on?'on':'')+'" data-go="'+x[0]+'">'+ic(x[1],24)+x[2]+'</button>'}).join('')}
function draw(){
  var f={login:login,home:home,list:list,recipe:recipe,form:form,favs:favs,me:me};
  var a=$("app");a.innerHTML=f[S.v]();a.classList.remove("turn");void a.offsetWidth;a.classList.add("turn");
  $("navbar").hidden=(S.v==="login");document.body.classList.toggle("nn",S.v==="login");if(S.v!=="login")nav();if(S.v==="home")wx();
  window.scrollTo(0,0);
  var q=$("q");if(q){q.addEventListener("input",function(){S.q=q.value});q.addEventListener("keydown",function(e){if(e.key==="Enter"&&S.q.trim()){S.cat=null;S.tag=null;S.v="list";draw()}})}
}

/* ---------- ações ---------- */
function shrink(file,max){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("foto"))},"image/jpeg",.82)};
    img.onerror=function(){rej(new Error("foto"))};img.src=u})
}
async function up(path,blob){var r=await sb.storage.from("recipe-photos").upload(path,blob,{upsert:true,contentType:"image/jpeg"});if(r.error)throw r.error}
function nice(e){var m=(e&&e.message)||"";if(/Invalid login/i.test(m))return "E-mail ou senha incorretos.";if(/fetch|network/i.test(m))return "Sem conexão com a internet.";return "Algo deu errado. Tente de novo."}

async function doLogin(){
  var b=$("lbtn");b.disabled=true;b.textContent="Entrando…";
  var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error){S.err=nice(r.error);draw();return}
  S.err="";S.user=r.data.user;await start();
}
async function start(){await load();S.v="home";draw()}
async function save(){
  var t=$("f_title").value.trim();if(!t){$("ferr").textContent="Dê um nome para a receita.";return}
  if(S.offline||!navigator.onLine){$("ferr").textContent="Sem internet. Conecte-se para salvar.";return}
  var row={title:t,category:$("f_cat").value,tags:tagsOf($("f_tags").value),prep_time:$("f_time").value.trim()||null,difficulty:$("f_dif").value||null,servings:$("f_por").value.trim()||null,ingredients:lines($("f_ing").value),steps:lines($("f_steps").value),notes:$("f_notes").value.trim()||null};
  row.source_url=(S.edit&&S.edit.source_url)||null;
  var b=$("sbtn");b.disabled=true;b.textContent="Salvando…";
  try{
    var id=S.edit&&S.edit.id;
    if(id){row.updated_at=new Date().toISOString();var u=await sb.from("recipes").update(row).eq("id",id);if(u.error)throw u.error}
    else{var i=await sb.from("recipes").insert(row).select().single();if(i.error)throw i.error;id=i.data.id}
    if(PH.cover){var p=S.user.id+"/"+id+"/capa.jpg";await up(p,PH.cover);var u2=await sb.from("recipes").update({photo_path:p}).eq("id",id);if(u2.error)throw u2.error;delete S.urls[p]}
    PH.cover=null;await load();S.id=id;S.v="recipe";draw();toast("Receita salva");
  }catch(e){b.disabled=false;b.textContent="Salvar receita";$("ferr").textContent=nice(e)}
}
async function del(){
  var r=S.edit;if(!r||!confirm("Apagar esta receita? Isso não pode ser desfeito."))return;
  try{
    var paths=[r.photo_path,r.result_photo_path].filter(Boolean);
    if(paths.length)await sb.storage.from("recipe-photos").remove(paths);
    var d=await sb.from("recipes").delete().eq("id",r.id);if(d.error)throw d.error;
    await load();S.v="home";draw();toast("Receita apagada");
  }catch(e){toast(nice(e))}
}
async function toggleFav(){
  var r=byId(S.id);if(!r)return;
  var v=!r.is_favorite;r.is_favorite=v;draw();
  var u=await sb.from("recipes").update({is_favorite:v}).eq("id",r.id);
  if(u.error){r.is_favorite=!v;draw();toast(nice(u.error))}
}

document.addEventListener("click",async function(e){
  var b=e.target.closest("[data-go],[data-cat],[data-tag],[data-open],[data-act],[data-addtag],[data-idea],[data-addsug]");if(!b)return;
  var d=b.dataset;
  if(d.addtag){var i=$("f_tags"),cur=tagsOf(i.value);if(cur.indexOf(d.addtag)<0)cur.push(d.addtag);i.value=cur.join(", ");return}
  if(d.addsug!==undefined){var x=SUGG[+d.addsug];S.edit={title:x.n,category:x.c,tags:x.t,source_url:x.u};PH.cover=null;S.v="form";draw();return}
  if(d.idea){S.edit={title:d.idea};PH.cover=null;S.v="form";draw();return}
  if(d.act==="saveme"){saveMe();return}
  if(d.act==="login"){doLogin();return}
  if(d.act==="logout"){await sb.auth.signOut();S.user=null;S.rows=[];S.v="login";draw();return}
  if(d.act==="fav"){toggleFav();return}
  if(d.act==="save"){save();return}
  if(d.act==="del"){del();return}
  if(d.act==="edit"){S.edit=byId(S.id);PH.cover=null;S.v="form";draw();return}
  if(d.act==="cancel"){S.v=S.edit&&S.edit.id?"recipe":"home";draw();return}
  if(d.cat){S.cat=d.cat;S.tag=null;S.q="";S.v="list"}
  else if(d.tag){S.tag=d.tag;S.cat=null;S.q="";S.v="list"}
  else if(d.open){S.id=d.open;S.v="recipe"}
  else if(d.go){S.v=d.go;if(S.v==="home"){S.cat=null;S.tag=null;S.q=""}if(S.v==="add"){S.edit=null;PH.cover=null;S.v="form"}}
  draw();
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&S.v==="login"&&(e.target.id==="pw"||e.target.id==="em"))doLogin()});
document.addEventListener("change",async function(e){
  var t=e.target;
  if(t.id==="f_cover"&&t.files[0]){try{PH.cover=await shrink(t.files[0],1280);var p=$("prev_cover");p.src=URL.createObjectURL(PH.cover);p.style.display="block"}catch(x){toast("Não consegui ler essa foto.")}}
  if(t.id==="resq"&&t.files[0]){
    var r=byId(S.id);if(!r)return;toast("Enviando foto…");
    try{var bl=await shrink(t.files[0],1280),p2=S.user.id+"/"+r.id+"/resultado.jpg";await up(p2,bl);var u=await sb.from("recipes").update({result_photo_path:p2}).eq("id",r.id);if(u.error)throw u.error;delete S.urls[p2];await load();draw();toast("Foto salva")}catch(x){toast(nice(x))}
  }
});

(async function init(){
  if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
  var r=await sb.auth.getSession();
  if(r.data&&r.data.session){S.user=r.data.session.user;await start()}else{S.v="login";draw()}
})();
</script>
