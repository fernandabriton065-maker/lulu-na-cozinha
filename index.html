<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf2f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lulu na Cozinha">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Lulu na Cozinha</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf2f0;--card:#fffdfc;--ink:#3a3436;--mut:#7d6e72;--line:#eedfdc;--sage:#4f7359;--blue:#4a7592;--chip:#f1e4e1;--t1:#f6e1dd;--t2:#e1eadf;--t3:#dde9ef;--t4:#f2e8d9;--err:#b3382c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#262023;--card:#322a2e;--ink:#f3e9e8;--mut:#bba8ac;--line:#463b40;--sage:#6f9a7b;--blue:#8fb8d1;--chip:#3a3135;--t1:#43343a;--t2:#33403a;--t3:#32414a;--t4:#433c33;--err:#f08a7e}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:repeating-linear-gradient(to bottom,transparent 0 35px,rgba(150,120,125,.09) 35px 36px);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:26px 22px 120px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0;letter-spacing:-.01em}
h1{font-size:36px;line-height:1.1}h2{font-size:28px;line-height:1.2}
h3{font-size:20px;margin:26px 0 10px;display:flex;gap:8px;align-items:center}
.hi{color:var(--mut);font-size:15px;margin:0 0 2px}
.sub{color:var(--mut);margin:6px 0 22px}
.ic{flex:none;vertical-align:middle}
.search{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin-bottom:16px;color:var(--mut)}
.search input{flex:1;border:0;background:none;padding:14px 0;font:inherit;color:var(--ink);outline:none;min-width:0}
.sug{display:flex;gap:14px;align-items:center;background:var(--t3);border-radius:20px;padding:16px;margin-bottom:22px;color:var(--blue)}
.sug small{display:block;color:var(--mut)}.sug b{display:block;color:var(--ink);font:500 17px/1.3 Fraunces,Georgia,serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border:0;border-radius:22px;padding:20px 16px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-height:122px;display:flex;flex-direction:column;justify-content:space-between}
.cat .ic{color:var(--sage)}.cat b{font:500 20px Fraunces,Georgia,serif}.cat small{color:var(--mut);display:block;line-height:1.2}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}
.lbl{color:var(--mut);font-size:13px;margin:24px 0 10px;letter-spacing:.05em;text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:999px;font:inherit;font-size:14.5px;cursor:pointer}
.item{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;margin-bottom:10px;cursor:pointer;color:var(--ink);font:inherit}
.th{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--sage);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.item b{font:500 17px/1.25 Fraunces,Georgia,serif;display:block}.item small{color:var(--mut)}
.back,.link{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--blue);font:600 15px Nunito,sans-serif;padding:0;margin-bottom:14px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
.hero{height:210px;border-radius:26px;display:grid;place-items:center;margin:16px 0 18px;color:var(--sage);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts .ic{color:var(--sage)}.facts b{display:block;font:500 17px Fraunces,Georgia,serif}.facts small{color:var(--mut)}
ul,ol{padding-left:20px;margin:0}li{margin-bottom:7px}
.box{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--mut);display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}
.f{display:block;width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.fl{display:block;font-size:14px;color:var(--mut);margin:12px 0 5px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;border:0;border-radius:16px;padding:15px;background:var(--sage);color:#fff;font:600 16px Nunito,sans-serif;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--chip);color:var(--ink)}.btn.del{background:none;color:var(--err)}.btn[disabled]{opacity:.6}
.prev{width:100%;height:150px;object-fit:cover;border-radius:16px;margin-bottom:8px;display:none}
.err{color:var(--err);font-size:14.5px;min-height:22px;margin:6px 0}
.off{background:var(--t4);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.login{padding-top:12vh;text-align:center}
.login .f{text-align:left}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14.5px;z-index:9;max-width:90%}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:480px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px Nunito,sans-serif;cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--sage)}
.turn{transform-origin:left center;animation:pg .4s ease-out}@keyframes pg{from{transform:perspective(900px) rotateY(-10deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav id="navbar" hidden><div id="nav"></div></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL="https://yhgebrxznkkqthjedijz.supabase.co";
var SB_KEY="sb_publishable_WWyLftD4R7j6QEV0g_sVRA_V0k_5yoK";
var sb=supabase.createClient(SB_URL,SB_KEY);

var I={
home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
dish:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>',
hat:'<path d="M7 19v-4.5a4 4 0 1 1 1.3-7.4 4 4 0 0 1 7.4 0A4 4 0 1 1 17 14.5V19zM7 17h10"/>',
heart:'<path d="M12 20s-7.5-4.6-7.5-10.2A4.1 4.1 0 0 1 12 7.6a4.1 4.1 0 0 1 7.5 2.2C19.5 15.4 12 20 12 20z"/>',
cam:'<path d="M4 8.5h3l1.5-2h7L17 8.5h3V19H4z"/><circle cx="12" cy="13.5" r="3.5"/>',
cake:'<path d="M5 20h14v-6.5H5zM5 13.5c1.5 0 2-1.5 3.5-1.5s2 1.5 3.5 1.5 2-1.5 3.5-1.5 2 1.5 3.5 1.5M12 9V6"/><path d="M12 6c-1-1-1-2 0-3 1 1 1 2 0 3z"/>',
pie:'<circle cx="12" cy="12" r="8.5"/><path d="M8 8l8 8M16 8l-8 8M12 3.5v17M3.5 12h17"/>',
fork:'<path d="M7 3v7M5 3v4.5a2 2 0 0 0 4 0V3M7 10v11M17 3c-2.5 2-2.5 7 0 8.5V21"/>',
book:'<path d="M5 5.5A2 2 0 0 1 7 3.5h11.5v16H7a2 2 0 0 0-2 2zM5 5.5v16"/>',
cup:'<path d="M5 10h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 11h1.5a2 2 0 0 1 0 4H16M8 3.5v3M12 3.5v3"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
jug:'<path d="M8.5 3h7l1.5 4v13.5H7V7zM7 10h10"/>',
list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>'};
function ic(n,s,fill){return '<svg class="ic" width="'+(s||24)+'" height="'+(s||24)+'" viewBox="0 0 24 24" fill="'+(fill?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>'}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

var CATS=[["Doces","cake","Bolos, tortas, sobremesas",1],["Salgados","pie","Tortas, lanches, massas",2],["Almoços","fork","Pratos do dia a dia",3],["Minhas receitas","book","Criadas por você",4]];
var TN={"Doces":1,"Salgados":2,"Almoços":3,"Minhas receitas":4};
var TAGS=["Bolos","Carnes","Aves","Peixes e frutos do mar","Sopas","Massas","Bebidas","Saudável","Festa"];
var S={user:null,rows:[],urls:{},v:"home",cat:null,tag:null,q:"",id:null,edit:null,offline:false,busy:false,err:""};
var PH={cover:null,result:null};
var $=function(i){return document.getElementById(i)};

function greet(){var h=new Date().getHours();return h<5?"Boa madrugada":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function lines(s){return s.split("\n").map(function(x){return x.trim()}).filter(Boolean)}
function tagsOf(s){return s.split(",").map(function(x){return x.trim()}).filter(Boolean)}
function byId(id){return S.rows.filter(function(r){return r.id===id})[0]}
function thumb(r,big){var u=r.photo_path&&S.urls[r.photo_path];return u?'<img src="'+u+'" alt="" loading="lazy">':ic("dish",big?64:28)}

async function sign(paths){
  var need=paths.filter(function(p){return p&&!S.urls[p]});
  if(!need.length)return;
  try{var r=await sb.storage.from("recipe-photos").createSignedUrls(need,3600);
    (r.data||[]).forEach(function(d){if(d.signedUrl)S.urls[d.path]=d.signedUrl})}catch(e){}
}
async function load(){
  try{
    var r=await sb.from("recipes").select("*").order("created_at",{ascending:false});
    if(r.error)throw r.error;
    S.rows=r.data;S.offline=false;
    try{localStorage.setItem("lulu_cache",JSON.stringify(r.data))}catch(e){}
    await sign(r.data.reduce(function(a,x){return a.concat([x.photo_path,x.result_photo_path])},[]));
  }catch(e){
    S.offline=true;
    try{S.rows=JSON.parse(localStorage.getItem("lulu_cache")||"[]")}catch(x){S.rows=[]}
  }
}

/* ---------- telas ---------- */
function login(){
  return '<div class="login"><h1>Lulu na Cozinha</h1><p class="sub">Receitas feitas com amor</p>'+
  '<input class="f" id="em" type="email" autocomplete="username" placeholder="E-mail" inputmode="email" autocapitalize="none">'+
  '<input class="f" id="pw" type="password" autocomplete="current-password" placeholder="Senha">'+
  '<div class="err" id="lerr">'+esc(S.err)+'</div><button class="btn" data-act="login" id="lbtn">Entrar</button></div>'}
function item(r){return '<button class="item" data-open="'+r.id+'"><div class="th t'+(TN[r.category]||4)+'">'+thumb(r)+'</div><div><b>'+esc(r.title)+'</b><small>'+esc([r.prep_time,r.difficulty].filter(Boolean).join(" · "))+'</small></div></button>'}
function home(){
  var n=S.rows.length;
  return (S.offline?'<div class="off">Sem internet: mostrando as receitas salvas no aparelho.</div>':'')+
  '<p class="hi">'+greet()+', Lulu</p><h1>Lulu na Cozinha</h1><p class="sub">Receitas feitas com amor</p>'+
  '<div class="search">'+ic("search",20)+'<input id="q" placeholder="Buscar uma receita" value="'+esc(S.q)+'"></div>'+
  '<div class="grid">'+CATS.map(function(c){var k=S.rows.filter(function(r){return r.category===c[0]}).length;return '<button class="cat t'+c[3]+'" data-cat="'+c[0]+'">'+ic(c[1],34)+'<div><b>'+c[0]+'</b><small>'+(k?k+(k===1?" receita":" receitas"):c[2])+'</small></div></button>'}).join('')+'</div>'+
  '<p class="lbl">Explorar</p><div class="chips">'+TAGS.map(function(t){return '<button class="chip" data-tag="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>'+
  (n?'':'<div class="box" data-go="add" style="margin-top:20px">Seu caderno está vazio. Toque aqui para criar a primeira receita.</div>')+
  '<p style="text-align:center;margin-top:34px"><button class="link" data-act="logout">Sair da conta</button></p>'}
function list(){
  var l=S.rows.filter(function(r){return S.cat?r.category===S.cat:S.tag?(r.tags||[]).indexOf(S.tag)>-1:true});
  var q=S.q.trim().toLowerCase();
  if(q)l=S.rows.filter(function(r){return (r.title+" "+(r.tags||[]).join(" ")+" "+(r.ingredients||[]).join(" ")).toLowerCase().indexOf(q)>-1});
  return '<button class="back" data-go="home">'+ic("back",18)+'Início</button><h2>'+esc(q?"Resultados":(S.cat||S.tag))+'</h2><p class="sub">'+l.length+(l.length===1?" receita":" receitas")+'</p>'+
  (l.length?l.map(item).join(''):'<div class="box" data-go="add">Nenhuma receita aqui ainda. Toque para criar.</div>')}
function favs(){
  var l=S.rows.filter(function(r){return r.is_favorite});
  return '<h2>Favoritas</h2><p class="sub">'+l.length+(l.length===1?" receita":" receitas")+'</p>'+
  (l.length?l.map(item).join(''):'<div class="box">Toque no coração dentro de uma receita para guardá-la aqui.</div>')}
function recipe(){
  var r=byId(S.id);if(!r)return home();
  var ru=r.result_photo_path&&S.urls[r.result_photo_path];
  return '<div class="top"><button class="back" data-go="list">'+ic("back",18)+'Voltar</button><button class="link" data-act="fav" aria-label="Favoritar" style="color:var(--sage)">'+ic("heart",26,r.is_favorite)+'</button></div>'+
  '<h2>'+esc(r.title)+'</h2><div class="hero t'+(TN[r.category]||4)+'">'+thumb(r,true)+'</div>'+
  '<div class="facts"><div>'+ic("clock",22)+'<b>'+esc(r.prep_time||"—")+'</b><small>Tempo</small></div><div>'+ic("hat",22)+'<b>'+esc(r.difficulty||"—")+'</b><small>Dificuldade</small></div><div>'+ic("dish",22)+'<b>'+esc(r.servings||"—")+'</b><small>Porções</small></div></div>'+
  ((r.tags||[]).length?'<div class="chips wrap" style="margin-top:14px">'+r.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div>':'')+
  '<h3>'+ic("jug",22)+'Ingredientes</h3>'+((r.ingredients||[]).length?'<ul>'+r.ingredients.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>':'<p class="sub" style="margin:0">Sem ingredientes ainda.</p>')+
  '<h3>'+ic("list",22)+'Modo de preparo</h3>'+((r.steps||[]).length?'<ol>'+r.steps.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ol>':'<p class="sub" style="margin:0">Sem passos ainda.</p>')+
  '<h3>Minhas observações</h3><p style="color:var(--mut);white-space:pre-wrap;margin:0">'+esc(r.notes||"Nenhuma anotação ainda.")+'</p>'+
  (r.source_url?'<p><a class="link" href="'+esc(r.source_url)+'" target="_blank" rel="noopener">Ver receita original</a></p>':'')+
  '<h3>Minha foto do resultado</h3>'+
  (ru?'<img class="hero" style="display:block;width:100%;height:210px;object-fit:cover;margin:0 0 10px" src="'+ru+'" alt="Foto do resultado">':'')+
  '<label class="box">'+ic("cam",22)+(ru?'Trocar a foto':'Tirar ou escolher foto')+'<input type="file" id="resq" accept="image/*" hidden></label>'+
  '<button class="btn alt" data-act="edit">Editar receita</button>'}
function form(){
  var r=S.edit||{};
  var cu=r.photo_path&&S.urls[r.photo_path];
  function opt(v,cur){return '<option'+(v===cur?' selected':'')+'>'+v+'</option>'}
  return '<button class="back" data-act="cancel">'+ic("back",18)+'Cancelar</button><h2>'+(r.id?'Editar receita':'Nova receita')+'</h2><p class="sub">Preencha o que souber. O resto você completa depois.</p>'+
  '<label class="fl" for="f_title">Nome da receita</label><input class="f" id="f_title" value="'+esc(r.title)+'">'+
  '<label class="fl" for="f_cat">Categoria</label><select class="f" id="f_cat">'+CATS.map(function(c){return opt(c[0],r.category||"Minhas receitas")}).join('')+'</select>'+
  '<div class="row"><div><label class="fl" for="f_time">Tempo</label><input class="f" id="f_time" placeholder="40 min" value="'+esc(r.prep_time)+'"></div>'+
  '<div><label class="fl" for="f_dif">Nível</label><select class="f" id="f_dif"><option value="">—</option>'+["Fácil","Médio","Difícil"].map(function(v){return opt(v,r.difficulty)}).join('')+'</select></div>'+
  '<div><label class="fl" for="f_por">Porções</label><input class="f" id="f_por" placeholder="8" value="'+esc(r.servings)+'"></div></div>'+
  '<label class="fl" for="f_tags">Etiquetas (separe por vírgula)</label><input class="f" id="f_tags" placeholder="Bolos, Festa" value="'+esc((r.tags||[]).join(", "))+'">'+
  '<div class="chips wrap">'+TAGS.map(function(t){return '<button type="button" class="chip" data-addtag="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>'+
  '<label class="fl" for="f_ing">Ingredientes (um por linha)</label><textarea class="f" id="f_ing" rows="6">'+esc((r.ingredients||[]).join("\n"))+'</textarea>'+
  '<label class="fl" for="f_steps">Modo de preparo (um passo por linha)</label><textarea class="f" id="f_steps" rows="6">'+esc((r.steps||[]).join("\n"))+'</textarea>'+
  '<label class="fl" for="f_notes">Minhas observações</label><textarea class="f" id="f_notes" rows="3">'+esc(r.notes)+'</textarea>'+
  '<label class="fl">Foto da receita</label><img class="prev" id="prev_cover" alt=""'+(cu?' src="'+cu+'" style="display:block"':'')+'>'+
  '<label class="box">'+ic("cam",22)+'Tirar ou escolher foto<input type="file" id="f_cover" accept="image/*" hidden></label>'+
  '<div class="err" id="ferr"></div><button class="btn" data-act="save" id="sbtn">Salvar receita</button>'+
  (r.id?'<button class="btn del" data-act="del">Apagar esta receita</button>':'')}
function nav(){
  var n=[["home","home","Início"],["favs","heart","Favoritas"],["add","plus","Nova"]];
  $("nav").innerHTML=n.map(function(x){var on=(S.v===x[0]||(x[0]==="home"&&(S.v==="list"||S.v==="recipe"))||(x[0]==="add"&&S.v==="form"));return '<button class="'+(on?'on':'')+'" data-go="'+x[0]+'">'+ic(x[1],24)+x[2]+'</button>'}).join('')}
function draw(){
  var f={login:login,home:home,list:list,recipe:recipe,form:form,favs:favs};
  var a=$("app");a.innerHTML=f[S.v]();a.classList.remove("turn");void a.offsetWidth;a.classList.add("turn");
  $("navbar").hidden=(S.v==="login");if(S.v!=="login")nav();
  window.scrollTo(0,0);
  var q=$("q");if(q){q.addEventListener("input",function(){S.q=q.value});q.addEventListener("keydown",function(e){if(e.key==="Enter"&&S.q.trim()){S.cat=null;S.tag=null;S.v="list";draw()}})}
}

/* ---------- ações ---------- */
function shrink(file,max){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("foto"))},"image/jpeg",.82)};
    img.onerror=function(){rej(new Error("foto"))};img.src=u})
}
async function up(path,blob){var r=await sb.storage.from("recipe-photos").upload(path,blob,{upsert:true,contentType:"image/jpeg"});if(r.error)throw r.error}
function nice(e){var m=(e&&e.message)||"";if(/Invalid login/i.test(m))return "E-mail ou senha incorretos.";if(/fetch|network/i.test(m))return "Sem conexão com a internet.";return "Algo deu errado. Tente de novo."}

async function doLogin(){
  var b=$("lbtn");b.disabled=true;b.textContent="Entrando…";
  var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error){S.err=nice(r.error);draw();return}
  S.err="";S.user=r.data.user;await start();
}
async function start(){await load();S.v="home";draw()}
async function save(){
  var t=$("f_title").value.trim();if(!t){$("ferr").textContent="Dê um nome para a receita.";return}
  if(S.offline||!navigator.onLine){$("ferr").textContent="Sem internet. Conecte-se para salvar.";return}
  var row={title:t,category:$("f_cat").value,tags:tagsOf($("f_tags").value),prep_time:$("f_time").value.trim()||null,difficulty:$("f_dif").value||null,servings:$("f_por").value.trim()||null,ingredients:lines($("f_ing").value),steps:lines($("f_steps").value),notes:$("f_notes").value.trim()||null};
  var b=$("sbtn");b.disabled=true;b.textContent="Salvando…";
  try{
    var id=S.edit&&S.edit.id;
    if(id){row.updated_at=new Date().toISOString();var u=await sb.from("recipes").update(row).eq("id",id);if(u.error)throw u.error}
    else{var i=await sb.from("recipes").insert(row).select().single();if(i.error)throw i.error;id=i.data.id}
    if(PH.cover){var p=S.user.id+"/"+id+"/capa.jpg";await up(p,PH.cover);var u2=await sb.from("recipes").update({photo_path:p}).eq("id",id);if(u2.error)throw u2.error;delete S.urls[p]}
    PH.cover=null;await load();S.id=id;S.v="recipe";draw();toast("Receita salva");
  }catch(e){b.disabled=false;b.textContent="Salvar receita";$("ferr").textContent=nice(e)}
}
async function del(){
  var r=S.edit;if(!r||!confirm("Apagar esta receita? Isso não pode ser desfeito."))return;
  try{
    var paths=[r.photo_path,r.result_photo_path].filter(Boolean);
    if(paths.length)await sb.storage.from("recipe-photos").remove(paths);
    var d=await sb.from("recipes").delete().eq("id",r.id);if(d.error)throw d.error;
    await load();S.v="home";draw();toast("Receita apagada");
  }catch(e){toast(nice(e))}
}
async function toggleFav(){
  var r=byId(S.id);if(!r)return;
  var v=!r.is_favorite;r.is_favorite=v;draw();
  var u=await sb.from("recipes").update({is_favorite:v}).eq("id",r.id);
  if(u.error){r.is_favorite=!v;draw();toast(nice(u.error))}
}

document.addEventListener("click",async function(e){
  var b=e.target.closest("[data-go],[data-cat],[data-tag],[data-open],[data-act],[data-addtag]");if(!b)return;
  var d=b.dataset;
  if(d.addtag){var i=$("f_tags"),cur=tagsOf(i.value);if(cur.indexOf(d.addtag)<0)cur.push(d.addtag);i.value=cur.join(", ");return}
  if(d.act==="login"){doLogin();return}
  if(d.act==="logout"){await sb.auth.signOut();S.user=null;S.rows=[];S.v="login";draw();return}
  if(d.act==="fav"){toggleFav();return}
  if(d.act==="save"){save();return}
  if(d.act==="del"){del();return}
  if(d.act==="edit"){S.edit=byId(S.id);PH.cover=null;S.v="form";draw();return}
  if(d.act==="cancel"){S.v=S.edit&&S.edit.id?"recipe":"home";draw();return}
  if(d.cat){S.cat=d.cat;S.tag=null;S.q="";S.v="list"}
  else if(d.tag){S.tag=d.tag;S.cat=null;S.q="";S.v="list"}
  else if(d.open){S.id=d.open;S.v="recipe"}
  else if(d.go){S.v=d.go;if(S.v==="home"){S.cat=null;S.tag=null;S.q=""}if(S.v==="add"){S.edit=null;PH.cover=null;S.v="form"}}
  draw();
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&S.v==="login"&&(e.target.id==="pw"||e.target.id==="em"))doLogin()});
document.addEventListener("change",async function(e){
  var t=e.target;
  if(t.id==="f_cover"&&t.files[0]){try{PH.cover=await shrink(t.files[0],1280);var p=$("prev_cover");p.src=URL.createObjectURL(PH.cover);p.style.display="block"}catch(x){toast("Não consegui ler essa foto.")}}
  if(t.id==="resq"&&t.files[0]){
    var r=byId(S.id);if(!r)return;toast("Enviando foto…");
    try{var bl=await shrink(t.files[0],1280),p2=S.user.id+"/"+r.id+"/resultado.jpg";await up(p2,bl);var u=await sb.from("recipes").update({result_photo_path:p2}).eq("id",r.id);if(u.error)throw u.error;delete S.urls[p2];await load();draw();toast("Foto salva")}catch(x){toast(nice(x))}
  }
});

(async function init(){
  if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
  var r=await sb.auth.getSession();
  if(r.data&&r.data.session){S.user=r.data.session.user;await start()}else{S.v="login";draw()}
})();
</script>
</body>
</html>
